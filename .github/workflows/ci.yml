name: CI

# Required on every pull request and push. Public repo, so Actions minutes
# are unmetered -- runs unconditionally, no path filtering.
#
# `tests/conftest.py` blocks every socket for the whole pytest session, so
# this job never reaches the live Patchstorage API. `rig catalog add` is the
# only command that does, and it is never run here -- the module archives it
# writes are committed (docs/catalog.md).
on:
  push:
  pull_request:

# Least privilege: this job only reads the checkout and runs tests, so the
# default token must not carry write scope -- guards against a future job
# addition silently inheriting more than it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -q
      - name: rig lint (smoke test against this checkout)
        run: uv run rig lint
