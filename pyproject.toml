[project]
name = "rig"
version = "0.1.0"
description = "Version-controlled config for whaleshrk's Organelle S2 / ORHACK live rig"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml",
    "typer",
    "httpx",
]

[project.scripts]
rig = "rig.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system/rig"]

[tool.pytest.ini_options]
testpaths = ["system/tests"]
pythonpath = ["system"]
addopts = "--verbose --tb=short -ra"

[tool.coverage.run]
source = ["rig"]

[tool.coverage.report]
show_missing = true
