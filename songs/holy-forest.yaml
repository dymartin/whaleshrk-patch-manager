song: Holy Forest
program: 2
keyboard: lead_2

chains:
  - name: lead_1
    input: { guitar: false }
    midi:
      channel: 1
    modules:
      - braids-plus@orhack:
          resonance: 4
          cutoff: 60
          timbre: 85
          colour: 85
          noise: 25
          volume: 90
      - tanh@orhack:
          dry-wet: 100
          amount: 70
      - bit-crush@orhack:
          dry-wet: 60
          depth: 60

  - name: lead_2
    input: { guitar: false }
    midi:
      channel: 2
    modules:
      - braids-plus@orhack:
          resonance: 2
          cutoff: 35
          timbre: 40
          colour: 30
          noise: 10
          volume: 80
      - plateverb@orhack:
          audio-thru-gain: 0
          decay: 95
          amount: 100
          diffusion: 1
          size: 4
          modulation: 40
          high-cut: 8000
          lo-cut: 200

  - name: pluck
    input: { guitar: false }
    midi:
      channel: 3
    modules:
      - 4wave@4wave-2:
          sine: 0
          triangle: 100
          clip-sine: 0
          clip-sine-x2: 0

  - name: pad
    input: { guitar: true }
    midi:
      channel: 4
    modules:
      - spectral-gate@orhack:
          gate: 0
          audio-gain: 0
          audio-thru-gain: 0
          midi:
            audio-gain: 22
      - clouds@orhack:
          mix: 80
          density: 75
          size: 65
          spread: 80
          texture: 60
          feedback: 30
          reverb: 70
